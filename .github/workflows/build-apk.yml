
name: Build V-Lines APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o '*.zip' -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin

      - name: Fix Java version
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          for p in pathlib.Path('.').rglob('*'):
              if p.suffix not in ('.gradle', '.kts'):
                  continue
              s = p.read_text()
              s = re.sub(r'(sourceCompatibility|targetCompatibility)\s*=?\s*1\.8', r'\1 = 17', s)
              s = s.replace('VERSION_1_8', 'VERSION_17')
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              p.write_text(s)
          PY


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java version
        run: |
          find . -name "build.gradle*" -type f -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Lines-APK
          path: app/build/outputs/apk/debug/app-debug.apk
